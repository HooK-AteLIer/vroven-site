<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вариант 4 · две половины сходятся</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Onest:wght@400;500&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root { --ink:#FFF3CC; --ink2:#D9D0B8; --gold:#D4AF37; --gold-hi:#FFC857; --laser:#2FD16B; --p:0; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:#0D0D0D; color:var(--ink); font:16px/1.5 Onest,sans-serif; }
  .track { height:320vh; position:relative; }
  .stage { position:sticky; top:0; height:100svh; overflow:hidden; display:flex; align-items:center; justify-content:center;
           background:radial-gradient(1000px 600px at 15% -10%,#3A2E10 0%,transparent 60%),#0D0D0D; }
  .half { position:absolute; top:12vh; bottom:12vh; width:44vw; overflow:hidden; border-radius:calc((1 - var(--k)) * 22px);
          box-shadow:0 30px 60px -30px rgba(0,0,0,.9); }
  .half.l { right:50%; transform:translateX(calc((1 - var(--k)) * -4vw)); }
  .half.r { left:50%; transform:translateX(calc((1 - var(--k)) * 4vw)); }
  /* по мере сближения половины растут до полного экрана */
  .half { top:calc(12vh * (1 - var(--g))); bottom:calc(12vh * (1 - var(--g))); width:calc(44vw + 6vw * var(--g)); }
  .half.l { border-top-right-radius:0; border-bottom-right-radius:0; }
  .half.r { border-top-left-radius:0; border-bottom-left-radius:0; }
  .layer { position:absolute; inset:0; background-size:cover; background-position:center; }
  .l .base { background-image:url('rough.webp'); background-position:30% center; }
  .r .base { background-image:url('workshop.webp'); }
  .fin { opacity:var(--f); background-image:url('final.webp'); background-size:calc(100vw) auto; }
  .l .fin { background-size:cover; width:200%; left:0; }
  .r .fin { background-size:cover; width:200%; left:-100%; }
  .label { position:absolute; left:24px; bottom:22px; right:24px; opacity:calc(1 - var(--f) * 1.6); }
  .r .label { text-align:right; }
  .label .k { font:500 11px/1 'JetBrains Mono',monospace; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); }
  .label .t { margin-top:8px; font:400 clamp(24px,3vw,44px)/1.05 Forum,serif; text-shadow:0 2px 18px rgba(0,0,0,.6); }
  .vline { position:absolute; top:0; bottom:0; left:50%; width:2px; margin-left:-1px; background:var(--laser); box-shadow:0 0 14px var(--laser);
           opacity:calc(var(--k) * (1 - var(--f) * .7)); transform:scaleY(var(--k)); }
  .hline { position:absolute; left:0; right:0; top:62%; height:2px; background:linear-gradient(90deg,transparent,var(--laser) 8%,var(--laser) 92%,transparent);
           box-shadow:0 0 14px var(--laser); transform:scaleX(var(--f)); opacity:var(--f); }
  .shade { position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg,rgba(13,13,13,.85) 0%,rgba(13,13,13,.2) 35%,transparent 55%); opacity:var(--f); }
  .top { position:absolute; left:0; right:0; top:4.5vh; text-align:center; opacity:calc(1 - var(--f) * 2); }
  .top .k { font:500 12px/1 'JetBrains Mono',monospace; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); }
  .top h1 { margin:8px 0 0; font:400 clamp(22px,2.6vw,38px)/1.1 Forum,serif; }
  .final { position:absolute; left:clamp(16px,5vw,72px); top:clamp(60px,10vh,110px); max-width:640px; opacity:var(--e); transform:translateY(calc((1 - var(--e)) * 14px)); }
  .final h2 { margin:0; font:400 clamp(38px,5.6vw,84px)/1.02 Forum,serif; letter-spacing:.03em; }
  .final p { color:var(--ink2); font-size:clamp(15px,1.5vw,19px); margin:12px 0 18px; max-width:500px; }
  .btn { display:inline-block; padding:14px 26px; border-radius:999px; font:500 15px/1 Onest,sans-serif; text-decoration:none; color:#1A1405; border:1.5px solid rgba(255,255,255,.6);
         background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.1) 45%,transparent 55%),linear-gradient(135deg,var(--gold-hi),var(--gold) 55%,#A8862A); box-shadow:inset 0 1px 1px rgba(255,255,255,.9),0 10px 26px -8px rgba(212,175,55,.7); }
  .hint { position:absolute; bottom:3vh; left:50%; transform:translateX(-50%); font:500 11px/1 'JetBrains Mono',monospace; letter-spacing:.18em; text-transform:uppercase; color:#9C9480; opacity:calc(1 - var(--k) * 3); }
  .after { height:60vh; display:grid; place-items:center; color:#9C9480; }
  @media (max-width:720px) {
    .half { top:calc(18vh * (1 - var(--g))); bottom:calc(18vh * (1 - var(--g))); }
    .label .t { font-size:22px; }
  }
</style>
</head>
<body>
<div class="track" id="track">
  <div class="stage" id="stage">
    <div class="top"><div class="k">Тюмень · Нижневартовск</div><h1>Обычно это две разные компании</h1></div>
    <div class="half l"><div class="layer base"></div><div class="layer fin"></div>
      <div class="label"><div class="k">Бригада ремонта</div><div class="t">Выравнивает стены</div></div></div>
    <div class="half r"><div class="layer base"></div><div class="layer fin"></div>
      <div class="label"><div class="k">Свой мебельный цех</div><div class="t">Делает мебель</div></div></div>
    <div class="shade"></div>
    <div class="vline"></div>
    <div class="hline"></div>
    <div class="final"><h2>У нас это одна команда</h2><p>Ремонт и мебель под ключ по одному договору. Стена и шкаф сходятся вровень.</p><a class="btn" href="#">Получить смету</a></div>
    <div class="hint">Листайте вниз ↓</div>
  </div>
</div>
<div class="after">Дальше идёт остальной сайт</div>
<script>
(function () {
  var track = document.getElementById('track'), st = document.getElementById('stage').style;
  function clamp(x) { return Math.max(0, Math.min(1, x)); }
  function smooth(a, b, x) { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); }
  function upd() {
    var r = track.getBoundingClientRect(), p = clamp(-r.top / (r.height - innerHeight));
    st.setProperty('--k', smooth(0, .4, p).toFixed(3));     // половины сближаются
    st.setProperty('--g', smooth(.35, .65, p).toFixed(3));  // растут на весь экран
    st.setProperty('--f', smooth(.45, .8, p).toFixed(3));   // проявляется готовая комната
    st.setProperty('--e', smooth(.75, .95, p).toFixed(3));  // финальный текст
  }
  addEventListener('scroll', upd, { passive:true }); addEventListener('resize', upd); upd();
})();
</script>
</body>
</html>
