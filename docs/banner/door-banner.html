<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>НА УРОВНЕ · баннер на дверь 80×200 см</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=block">
<style>
  /* 1 px макета = 1 мм баннера: 800 × 2000 */
  @page { size:800px 2000px; margin:0; }
  * { box-sizing:border-box; }
  html,body { margin:0; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  body { width:800px; height:2000px; overflow:hidden; background:#0D0D0D; color:#FFF3CC; font-family:Onest,sans-serif; }
  .b { position:relative; width:800px; height:2000px; padding:70px 64px 0;
       background:radial-gradient(900px 600px at 0% 0%,#3A2E10 0%,transparent 60%),radial-gradient(700px 500px at 100% 100%,#1E2A1F 0%,transparent 65%),#0D0D0D; }
  .frame { position:absolute; inset:22px; border:2px solid rgba(212,175,55,.55); border-radius:6px; pointer-events:none; }
  .eyebrow { font:700 18px/1 'JetBrains Mono',monospace; letter-spacing:.32em; color:#D4AF37; text-align:center; }
  .logo { display:block; width:672px; margin:20px auto 0; }
  .tag { margin:30px 0 0; text-align:center; font:400 46px/1.1 Forum,serif; letter-spacing:.03em; }
  .photo { margin:44px -34px 0; border-radius:4px; overflow:hidden; height:520px; background:url('photo.webp') center 58% / cover no-repeat; position:relative; }
  .photo::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,#0D0D0D 0%,transparent 18%,transparent 70%,#0D0D0D 100%); }
  .note { position:absolute; left:64px; right:64px; bottom:30px; z-index:1; text-align:center; font:400 30px/1.25 Forum,serif; color:#FFF3CC; text-shadow:0 2px 14px rgba(0,0,0,.8); }
  .note small { display:block; font:600 17px/1.3 Onest,sans-serif; color:#D9D0B8; margin-top:6px; letter-spacing:.02em; }
  h1 { margin:40px 0 26px; text-align:center; font:400 54px/1.08 Forum,serif; letter-spacing:.01em; }
  h1 span { color:#FFC857; }
  .rule { position:relative; height:3px; margin:0 -10px; background:#2FD16B; box-shadow:0 0 14px #2FD16B; }
  .rule::after { content:''; position:absolute; left:50%; top:50%; width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:50%; background:#2FD16B; box-shadow:0 0 18px #2FD16B; }
  .tel { padding:42px 0 46px; text-align:center; }
  .tel .k { font:700 20px/1 'JetBrains Mono',monospace; letter-spacing:.3em; color:#D4AF37; }
  .tel .n { margin-top:22px; font:600 128px/1 Onest,sans-serif; letter-spacing:.02em; color:#FFF3CC; white-space:nowrap; }
  .qr { margin:46px auto 0; width:470px; text-align:center; }
  .qr img { width:470px; height:470px; display:block; padding:26px; border:2px solid rgba(255,243,204,.5); border-radius:20px; background:#0D0D0D; }
  .qr span { display:block; margin-top:18px; font:600 20px/1.3 'JetBrains Mono',monospace; letter-spacing:.14em; color:#D4AF37; }
  .foot { position:absolute; left:64px; right:64px; bottom:56px; margin:0; text-align:center; font:500 17px/1.3 'JetBrains Mono',monospace; letter-spacing:.14em; color:#9C9480; }
</style>
</head>
<body>
<div class="b">
  <div class="frame"></div>
  <img class="logo" src="../../site/assets/img/logo/naurovne-wordmark-inverse.svg?v=3" alt="НА УРОВНЕ">
  <div class="tag">Ремонт и мебель под ключ</div>

  <div class="photo"><div class="note">Соседи, простите за шум.<br>Скоро здесь будет красиво.</div></div>

  <h1>Один договор на&nbsp;ремонт <span>и&nbsp;мебель</span></h1>

  <div class="rule"></div>
  <div class="tel"><div class="k">ТЕЛЕФОН ДЛЯ СВЯЗИ</div><div class="n">68-22-66</div></div>
  <div class="rule"></div>

  <div class="qr"><img src="qr-site.svg" alt="QR-код сайта"><span>САЙТ И РАСЧЁТ СТОИМОСТИ</span></div>

  <p class="foot">ВСЁ НА ОДНОМ УРОВНЕ</p>
</div>
</body>
</html>
